<style>
  @font-face {
    font-family: "Geist";
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url("fonts/Geist_wght_.woff2") format("woff2-variations"),
         url("fonts/Geist_wght_.woff2") format("woff2");
  }
  @font-face {
    font-family: "Geist";
    font-style: italic;
    font-weight: 100 900;
    font-display: swap;
    src: url("fonts/Geist-Italic_wght_.woff2") format("woff2-variations"),
         url("fonts/Geist-Italic_wght_.woff2") format("woff2");
  }
</style>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Geist', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
        maxWidth: { 'page': '1700px' },
      },
    },

<style>
  html { font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; }
  body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
  .no-scrollbar::-webkit-scrollbar { display: none; }

  /* Linery KPI card variants */
  .kpi { position: relative; overflow: hidden; padding: 1rem 1.25rem; border-radius: 0.75rem; border: 1px solid; }
  .kpi-label { font-size: 0.75rem; font-weight: 500; color: #64748b; text-transform: uppercase; letter-spacing: 0.04em; }
  .kpi-value { font-size: 1.875rem; font-weight: 700; letter-spacing: -0.025em; line-height: 1.1; margin-top: 0.5rem; }
  .kpi-sub { font-size: 0.75rem; color: #64748b; margin-top: 0.5rem; }

  .kpi-blue   { background: linear-gradient(135deg, #eff6ff 0%, rgba(219,234,254,.5) 100%); border-color: rgba(191,219,254,.7); }
  .kpi-blue   .kpi-value { color: #1d4ed8; }
  .kpi-green  { background: linear-gradient(135deg, #ecfdf5 0%, rgba(167,243,208,.4) 100%); border-color: rgba(167,243,208,.8); }
  .kpi-green  .kpi-value { color: #047857; }
  .kpi-amber  { background: linear-gradient(135deg, #fffbeb 0%, rgba(253,230,138,.4) 100%); border-color: rgba(253,230,138,.8); }
  .kpi-amber  .kpi-value { color: #b45309; }
  .kpi-purple { background: linear-gradient(135deg, #faf5ff 0%, rgba(233,213,255,.5) 100%); border-color: rgba(233,213,255,.8); }
  .kpi-purple .kpi-value { color: #6b21a8; }
  .kpi-sky    { background: linear-gradient(135deg, #f0f9ff 0%, rgba(186,230,253,.4) 100%); border-color: rgba(186,230,253,.8); }
  .kpi-sky    .kpi-value { color: #0369a1; }
  .kpi-rose   { background: linear-gradient(135deg, #fff1f2 0%, rgba(254,205,211,.4) 100%); border-color: rgba(254,205,211,.8); }
  .kpi-rose   .kpi-value { color: #be123c; }

  /* Table base */
  .ltable { width: 100%; border-collapse: collapse; }
  .ltable thead { background: #f9fafb; }
  .ltable th { padding: 0.75rem 1rem; text-align: left; font-size: 0.75rem; font-weight: 500; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; border-bottom: 1px solid #e5e7eb; }
  .ltable td { padding: 0.875rem 1rem; font-size: 0.875rem; color: #111827; border-bottom: 1px solid #f3f4f6; vertical-align: top; }
  .ltable tbody tr:hover { background: rgba(249,250,251,.5); }
  .ltable tbody tr:last-child td { border-bottom: none; }

  /* Badges (chip pills) */
  .lpill { display: inline-flex; align-items: center; padding: 0.125rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; border: 1px solid; white-space: nowrap; line-height: 1.3; }

  /* Ribbon tab underline animation */
  .tab-active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: #2563eb; }

  /* Star rating */
  .star { color: #f59e0b; }
  .star-off { color: #e5e7eb; }

  /* Sparkline bars */
  .spark { display: inline-block; height: 8px; background: #2563eb; border-radius: 9999px; }
</style>
</head>
