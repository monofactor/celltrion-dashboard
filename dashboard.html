<style>
  html { font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; }
  body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
  .no-scrollbar::-webkit-scrollbar { display: none; }

  /* Linery KPI card variants */
  .kpi { position: relative; overflow: hidden; padding: 1rem 1.25rem; border-radius: 0.75rem; border: 1px solid; }
  .kpi-label { font-size: 0.75rem; font-weight: 500; color: #64748b; text-transform: uppercase; letter-spacing: 0.04em; }
  .kpi-value { font-size: 1.875rem; font-weight: 700; letter-spacing: -0.025em; line-height: 1.1; margin-top: 0.5rem; }
  .kpi-sub { font-size: 0.75rem; color: #64748b; margin-top: 0.5rem; }

  .kpi-blue   { background: linear-gradient(135deg, #eff6ff 0%, rgba(219,234,254,.5) 100%); border-color: rgba(191,219,254,.7); }
  .kpi-blue   .kpi-value { color: #1d4ed8; }
  .kpi-green  { background: linear-gradient(135deg, #ecfdf5 0%, rgba(167,243,208,.4) 100%); border-color: rgba(167,243,208,.8); }
  .kpi-green  .kpi-value { color: #047857; }
  .kpi-amber  { background: linear-gradient(135deg, #fffbeb 0%, rgba(253,230,138,.4) 100%); border-color: rgba(253,230,138,.8); }
  .kpi-amber  .kpi-value { color: #b45309; }
  .kpi-purple { background: linear-gradient(135deg, #faf5ff 0%, rgba(233,213,255,.5) 100%); border-color: rgba(233,213,255,.8); }
  .kpi-purple .kpi-value { color: #6b21a8; }
  .kpi-sky    { background: linear-gradient(135deg, #f0f9ff 0%, rgba(186,230,253,.4) 100%); border-color: rgba(186,230,253,.8); }
  .kpi-sky    .kpi-value { color: #0369a1; }
  .kpi-rose   { background: linear-gradient(135deg, #fff1f2 0%, rgba(254,205,211,.4) 100%); border-color: rgba(254,205,211,.8); }
  .kpi-rose   .kpi-value { color: #be123c; }

  /* Table base */
  .ltable { width: 100%; border-collapse: collapse; }
  .ltable thead { background: #f9fafb; }
  .ltable th { padding: 0.75rem 1rem; text-align: left; font-size: 0.75rem; font-weight: 500; color: #6b7280; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; border-bottom: 1px solid #e5e7eb; }
  .ltable td { padding: 0.875rem 1rem; font-size: 0.875rem; color: #111827; border-bottom: 1px solid #f3f4f6; vertical-align: top; }
  .ltable tbody tr:hover { background: rgba(249,250,251,.5); }
  .ltable tbody tr:last-child td { border-bottom: none; }

  /* Badges (chip pills) */
  .lpill { display: inline-flex; align-items: center; padding: 0.125rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; border: 1px solid; white-space: nowrap; line-height: 1.3; }

  /* Ribbon tab underline animation */
  .tab-active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: #2563eb; }

  /* Star rating */
  .star { color: #f59e0b; }
  .star-off { color: #e5e7eb; }

  /* Sparkline bars */
  .spark { display: inline-block; height: 8px; background: #2563eb; border-radius: 9999px; }
</style>
</head>

    <div className="max-w-page mx-auto px-6 py-6 space-y-6">
      <div className="flex items-end justify-between gap-6">
        <div>

        </div>
        {actions && <div className="flex items-center gap-2">{actions}</div>}
      </div>
      {children}
    </div>
  );
}

// ── KPI card ────────────────────────────────────────────────────────────────
function KPI({ label, value, delta, sub, tone = "blue" }) {
  return (
    <div className={`kpi kpi-${tone}`}>
      <div className="kpi-label">{label}</div>
      <div className="kpi-value">{value}</div>
      <div className="mt-2 space-y-0.5">
        {delta && (
          <div className={`text-xs font-semibold inline-flex items-center gap-0.5 ${tone === "rose" ? "text-rose-700" : "text-emerald-700"}`}>
            <I.ArrowUpRight className="w-3 h-3"/>{delta}
          </div>
        )}
        <div className="text-xs text-slate-500">{sub}</div>
      </div>
    </div>
  );
}

// ── Pill / badge ────────────────────────────────────────────────────────────
const PILL_TONES = {
  blue:    "bg-blue-50 text-blue-700 border-blue-200",
  amber:   "bg-amber-50 text-amber-700 border-amber-200",
  sky:     "bg-sky-50 text-sky-700 border-sky-200",
  green:   "bg-emerald-50 text-emerald-700 border-emerald-200",
  red:     "bg-red-50 text-red-700 border-red-200",
  purple:  "bg-purple-50 text-purple-700 border-purple-200",
  gray:    "bg-gray-100 text-gray-700 border-gray-200",
  orange:  "bg-orange-50 text-orange-700 border-orange-200",
  dashed:  "bg-white text-gray-500 border-dashed border-gray-300",
};
function Pill({ tone = "blue", children, className = "" }) {
  return <span className={`lpill ${PILL_TONES[tone]} ${className}`}>{children}</span>;
}

// ── Stars ───────────────────────────────────────────────────────────────────
function Stars({ count = 5, total = 5 }) {
  return (
    <span className="inline-flex gap-0.5">
      {Array.from({ length: total }).map((_, i) => (
        <I.Star key={i} className={`w-3.5 h-3.5 ${i < count ? "star" : "star-off"}`}/>
      ))}
    </span>
  );
}

// ── Filter chips (segmented) ────────────────────────────────────────────────
function FilterChips({ options, value, onChange }) {
  return (
    <div className="flex items-center gap-2 flex-wrap">
      {options.map((opt) => {
        const v = typeof opt === "string" ? opt : opt.value;
        const label = typeof opt === "string" ? opt : opt.label;
        const count = typeof opt === "object" ? opt.count : undefined;
        const isActive = value === v;
        return (
          <button
            key={v}
            type="button"
            onClick={() => onChange(v)}
            className={`h-8 px-3.5 rounded-full text-xs font-medium border transition-colors ${
              isActive
                ? "bg-blue-600 text-white border-blue-600"
                : "bg-white text-gray-700 border-gray-200 hover:bg-gray-50"
            }`}
          >
            {label}{count !== undefined && <span className={`ml-1 ${isActive ? "text-blue-100" : "text-gray-400"}`}>({count})</span>}
          </button>
        );
      })}
    </div>
  );
}

// ── Filter bar wrapper (Linery card style) ──────────────────────────────────
function FilterBar({ children }) {
  return (
    <div className="bg-white border border-gray-200 rounded-xl p-3 flex items-center gap-3 flex-wrap">
      {children}
    </div>
  );
}

// ── Section card ────────────────────────────────────────────────────────────
function Card({ children, className = "", title, subtitle, action }) {
  return (
    <section className={`bg-white border border-gray-200 rounded-xl ${className}`}>
      {(title || action) && (
        <header className="px-5 py-3.5 border-b border-gray-100 flex items-center justify-between gap-4">
          <div>
            {title && <h2 className="text-sm font-semibold text-gray-900 uppercase tracking-wider flex items-center">{title}</h2>}
            {subtitle && <p className="text-xs text-gray-500 mt-0.5">{subtitle}</p>}
          </div>
          {action}
        </header>
      )}
      {children}
    </section>
  );
}

Object.assign(window, {
  I, BrandLogo, Flag, Ribbon, NAV_ITEMS, PageShell, KPI, Pill, Stars, FilterChips, FilterBar, Card,
});

function HBar({ data, accent = "#2563eb", plannedAccent = "#a855f7" }) {
  const max = Math.max(...data.map(d => d.value));
  return (
    <div className="space-y-2.5">
      {data.map((d) => (
        <div key={d.year} className="grid grid-cols-[48px_1fr_72px] items-center gap-3">
          <div className="text-xs text-gray-600 font-medium">{d.year}</div>
          <div className="relative h-6 bg-gray-100 rounded-md overflow-hidden">
            <div
              className="h-full rounded-md"
              style={{ width: `${(d.value / max) * 100}%`, background: d.planned ? plannedAccent : accent, opacity: d.planned ? 0.8 : 1 }}
            />
            <span className="absolute inset-y-0 left-2 inline-flex items-center text-[11px] font-semibold text-white drop-shadow">
              {d.label}
            </span>
          </div>
          <div className="text-[10px] uppercase tracking-wider text-gray-400 font-medium">{d.planned ? "Hedef" : "Fiili"}</div>
        </div>
      ))}
    </div>
  );
}
function DonutMix({ data }) {
  const total = data.reduce((s, d) => s + d.pct, 0);
  let acc = 0;
  const r = 60, cx = 80, cy = 80, stroke = 18;
  const C = 2 * Math.PI * r;
  return (
    <div className="flex items-center gap-5">
      <svg width="160" height="160" viewBox="0 0 160 160" className="shrink-0">
        <circle cx={cx} cy={cy} r={r} fill="none" stroke="#f3f4f6" strokeWidth={stroke}/>
        {data.map((d, i) => {
          const seg = (d.pct / total) * C;
          const dasharray = `${seg} ${C - seg}`;
          const offset = -acc;
          acc += seg;
          return (
            <circle key={i} cx={cx} cy={cy} r={r} fill="none" stroke={d.color} strokeWidth={stroke}
              strokeDasharray={dasharray} strokeDashoffset={offset}
              transform={`rotate(-90 ${cx} ${cy})`}/>
          );
        })}
        <text x={cx} y={cy - 4} textAnchor="middle" className="fill-gray-900" style={{ fontWeight: 700, fontSize: 16 }}>2025</text>
        <text x={cx} y={cy + 14} textAnchor="middle" className="fill-gray-500" style={{ fontSize: 10 }}>Ürün Karması</text>
      </svg>
      <ul className="grid grid-cols-1 gap-1.5 text-xs flex-1">
        {data.map((d) => (
          <li key={d.name} className="flex items-center justify-between gap-3">
            <span className="inline-flex items-center gap-2 text-gray-700">
              <span className="w-2.5 h-2.5 rounded-sm" style={{ background: d.color }}/>
              {d.name}
            </span>
            <span className="font-semibold text-gray-900">{d.pct}%</span>
          </li>
        ))}
      </ul>
    </div>
  );
}

<script type="text/babel">
// === app.jsx ===
/* global React, ReactDOM, window */
// Entry point — routes ribbon nav to page components, hash-routed.

const { useState: useAppState, useEffect: useAppEffect } = React;

function readHash() {
  const h = (location.hash || "#summary").replace(/^#\/?/, "").split("/")[0];
  return NAV_ITEMS.find((n) => n.id === h) ? h : "summary";
}

function App() {
  const [page, setPage] = useAppState(readHash);

  useAppEffect(() => {
    const onHash = () => setPage(readHash());
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  const navigate = (id) => {
    location.hash = "#" + id;
    setPage(id);
    window.scrollTo({ top: 0 });
  };

  const Page = {
    summary: PageSummary,
    portfolio: PagePortfolio,
    pipeline: PagePipeline,
    markets: PageMarkets,
    news: PageNews,
    risks: PageRisks,
    signals: PageSignals,
    financial: PageFinancial,
    cenk: PageCenk
  }[page] || PageSummary;

  return (
    <div className="min-h-screen bg-gray-50">
      <Ribbon active={page} onChange={navigate} />
      <main data-screen-label={page}>
        <Page />
      </main>
      <footer className="max-w-page mx-auto px-6 py-8 text-[11px] text-gray-400 border-t border-gray-200 mt-12 flex items-center justify-between">
        <span>Celltrion Dashboard · Mayıs 2026</span>
        <img src={window.LINERY_LOGO} alt="Linery" style={{ height: 54, width: "auto", display: "block" }} />
      </footer>
    </div>);

}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
